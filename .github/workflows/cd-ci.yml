name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - test  # O la rama que desees
    paths:
      - 'vaccine_management/**/*'  # Solo activa el flujo si hay cambios en esta carpeta
      - 'client/**/*'               # También activa el flujo si hay cambios en la carpeta del cliente

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build and Push Docker images if changes detected (Microservices)
        run: |
          # Condicionalmente construir solo el servicio modificado
          if [[ $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "vaccine_management") ]]; then
            docker build -f vaccine_management/Microservice_create_vaccine/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine:latest vaccine_management/Microservice_create_vaccine
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine:latest
            
            docker build -f vaccine_management/Microservice_update_vaccine/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_update_vaccine:latest vaccine_management/Microservice_update_vaccine
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_update_vaccine:latest
            
            docker build -f vaccine_management/Microservice_list_vaccine/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_list_vaccine:latest vaccine_management/Microservice_list_vaccine
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_list_vaccine:latest
            
            docker build -f vaccine_management/Microservice_delete_vaccine/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_delete_vaccine:latest vaccine_management/Microservice_delete_vaccine
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_delete_vaccine:latest
          fi

      - name: Build and Push Docker image if changes detected (Client)
        run: |
          # Condicionalmente construir solo la imagen del cliente si hay cambios
          if [[ $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "client") ]]; then
            docker build -f client/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/cliente:latest client
            docker push ${{ secrets.DOCKER_USERNAME }}/cliente:latest
          fi

  deploy-vaccine:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 and deploy Docker containers for vaccine microservices
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_VACCINE_SERVER }}
          username: ubuntu
          key: ${{ secrets.VACCINE_SERVER_KEY }}
          script: |
            # Verificar si Docker está instalado, si no, instalarlo
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker se inicie automáticamente
            sudo systemctl enable --now docker

            # Descargar las últimas imágenes desde Docker Hub
            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_update_vaccine:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_list_vaccine:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_delete_vaccine:latest

            # Verificar si las imágenes fueron descargadas correctamente
            sudo docker images

            # Detener y eliminar los contenedores existentes por nombre
            sudo docker stop microservice_create_vaccine || true
            sudo docker rm microservice_create_vaccine || true
            sudo docker stop microservice_update_vaccine || true
            sudo docker rm microservice_update_vaccine || true
            sudo docker stop microservice_list_vaccine || true
            sudo docker rm microservice_list_vaccine || true
            sudo docker stop microservice_delete_vaccine || true
            sudo docker rm microservice_delete_vaccine || true

            # Crear el archivo .env dentro de la carpeta src
            mkdir -p src
            echo "REACT_APP_RDS_HOST=${{ secrets.REACT_APP_RDS_HOST }}" >> src/.env
            echo "REACT_APP_RDS_PORT=${{ secrets.REACT_APP_RDS_PORT }}" >> src/.env
            echo "REACT_APP_RDS_DATABASE=${{ secrets.REACT_APP_RDS_DATABASE }}" >> src/.env
            echo "REACT_APP_RDS_USER=${{ secrets.REACT_APP_RDS_USER }}" >> src/.env
            echo "REACT_APP_RDS_PASSWORD=${{ secrets.REACT_APP_RDS_PASSWORD }}" >> src/.env

            # Verificar que el archivo .env se ha creado correctamente
            cat src/.env

            # Ejecutar los contenedores Docker con el archivo .env dentro de src
            echo "Ejecutando microservice_create_vaccine..."
            sudo docker run -d --name microservice_create_vaccine --env-file src/.env -p 3001:3001 ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine:latest
            echo "Ejecutando microservice_update_vaccine..."
            sudo docker run -d --name microservice_update_vaccine --env-file src/.env -p 3004:3004 ${{ secrets.DOCKER_USERNAME }}/microservice_update_vaccine:latest
            echo "Ejecutando microservice_list_vaccine..."
            sudo docker run -d --name microservice_list_vaccine --env-file src/.env -p 3002:3002 ${{ secrets.DOCKER_USERNAME }}/microservice_list_vaccine:latest
            echo "Ejecutando microservice_delete_vaccine..."
            sudo docker run -d --name microservice_delete_vaccine --env-file src/.env -p 3003:3003 ${{ secrets.DOCKER_USERNAME }}/microservice_delete_vaccine:latest

            # Verificar que los contenedores están corriendo
            sudo docker ps -a

  deploy-client:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 (Client) and deploy Docker container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_CLIENT_SERVER }}
          username: ubuntu
          key: ${{ secrets.CLIENT_SERVER_KEY }}
          script: |
            # Instalar Docker en la instancia EC2 (Cliente)
            sudo apt update && sudo apt install -y docker.io

            # Asegurarse de que Docker inicie automáticamente
            sudo systemctl enable --now docker

            # Eliminar imágenes antiguas del cliente
            echo "Eliminando imágenes antiguas..."
            sudo docker images -q ${{ secrets.DOCKER_USERNAME }}/cliente | xargs sudo docker rmi -f || true

            # Descargar la última imagen del cliente desde Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Detener cualquier contenedor que esté corriendo
            sudo docker ps -q | xargs sudo docker stop || true
            sudo docker ps -q | xargs sudo docker rm || true

            # Iniciar el nuevo contenedor con la imagen descargada
            sudo docker run -d -p 80:80 ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Verificar que el contenedor está corriendo
            sudo docker ps -a
