name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - test  # O la rama que estás utilizando para despliegues

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Microservice Login Docker Image
      - name: Build and Push Microservice Login Docker image
        run: |
          docker build -f Microservice_login/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest ./Microservice_login
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest

      # Build and Push Microservice Logout Docker Image
      - name: Build and Push Microservice Logout Docker image
        run: |
          docker build -f Microservice_logout/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest ./Microservice_logout
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest

      # Build and Push Microservice Register User Docker Image
      - name: Build and Push Microservice Register User Docker image
        run: |
          docker build -f Microservice_register_user/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_register_user:latest ./Microservice_register_user
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_register_user:latest

      # Build and Push Microservice Send OTP Docker Image
      - name: Build and Push Microservice Send OTP Docker image
        run: |
          docker build -f Microservice_sendVerifiOTP/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_send_verifi_otp:latest ./Microservice_sendVerifiOTP
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_send_verifi_otp:latest

      # Build and Push Microservice Verifi Email Docker Image
      - name: Build and Push Microservice Verifi Email Docker image
        run: |
          docker build -f Microservice_verifiEmail/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_verifi_email:latest ./Microservice_verifiEmail
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_verifi_email:latest

  deploy-vaccine-management:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 (Vaccine Management) and deploy Docker containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_VACCINE_SERVER }}
          username: ubuntu
          key: ${{ secrets.VACCINE_SERVER_KEY }}
          script: |
            # Install Docker on the EC2 instance (Vaccine Management)
            sudo apt update && sudo apt install -y docker.io

            # Ensure Docker starts automatically
            sudo systemctl enable --now docker

            # Pull the latest microservice images from Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_register_user:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_send_verifi_otp:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_verifi_email:latest

            # Stop any running containers
            sudo docker ps -q | xargs sudo docker stop || true
            sudo docker ps -q | xargs sudo docker rm || true

            # Start the new containers with the pulled images
            # Example: Start the microservice containers
            sudo docker run -d -p 3011:3011 ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest
            sudo docker run -d -p 3012:3012 ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest
            sudo docker run -d -p 3010:3010 ${{ secrets.DOCKER_USERNAME }}/microservice_register_user:latest
            sudo docker run -d -p 3013:3013 ${{ secrets.DOCKER_USERNAME }}/microservice_send_verifi_otp:latest
            sudo docker run -d -p 3014:3014 ${{ secrets.DOCKER_USERNAME }}/microservice_verifi_email:latest

            # Verify the containers are running
            sudo docker ps

  deploy-client:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 (Client) and deploy Docker container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_CLIENT_SERVER }}
          username: ubuntu
          key: ${{ secrets.CLIENT_SERVER_KEY }}
          script: |
            # Install Docker on the EC2 instance (Client)
            sudo apt update && sudo apt install -y docker.io

            # Ensure Docker starts automatically
            sudo systemctl enable --now docker

            # Pull the latest client image from Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Stop any running containers
            sudo docker ps -q | xargs sudo docker stop || true
            sudo docker ps -q | xargs sudo docker rm || true

            # Start the new container with the pulled image
            sudo docker run -d -p 80:80 ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Verify the container is running
            sudo docker ps
