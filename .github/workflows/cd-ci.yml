name: Deploy Vaccine Management on EC2
#docker test N°10 
on:
  push:
    branches:
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image to Docker Hub
        run: |
          # Construir la imagen Docker
          docker build -f client/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/client:latest client

          # Subir la imagen a Docker Hub
          docker push ${{ secrets.DOCKER_USERNAME }}/client:latest

  deploy-client:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 (Client) and deploy Docker container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_CLIENT_SERVER }}
          username: ubuntu
          key: ${{ secrets.CLIENT_SERVER_KEY }}
          script: |
            # Instalar Docker en la instancia EC2 (si no está instalado)
            sudo apt update && sudo apt install -y docker.io

            # Asegurarse de que Docker inicie automáticamente
            sudo systemctl enable --now docker

            # Descargar la última imagen de cliente de Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/client:latest

            # Detener y eliminar contenedores en ejecución
            sudo docker ps -q | xargs sudo docker stop || true
            sudo docker ps -q | xargs sudo docker rm || true

            # Iniciar el contenedor con la imagen descargada
            sudo docker run -d -p 5173:5173 ${{ secrets.DOCKER_USERNAME }}/client:latest

            # Verificar que el contenedor se esté ejecutando
            sudo docker ps -a
