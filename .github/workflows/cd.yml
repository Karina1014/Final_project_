name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - test  # O la rama que estés utilizando

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v2

      # Paso 2: Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 3: Construir y subir la imagen Docker del cliente
      - name: Build and Push Client Docker image
        run: |
          docker build -f client/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/cliente:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/cliente:latest

      # Paso 4: Construir y subir las imágenes Docker de los microservicios
      - name: Build and Push Dog Management Microservices
        run: |
          for service in isAuthentication login logout sendVerifiOTP verifiEmail; do
            echo "Building and pushing microservice_${service}"
            docker build -f dog_management/Microservice_${service}/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest dog_management/Microservice_${service}_dog
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest
          done

  deploy-client:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 (Client) and deploy Docker container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_CLIENT_SERVER }}
          username: ubuntu
          key: ${{ secrets.CLIENT_SERVER_KEY }}
          script: |
            # Asegurarse de que Docker esté instalado
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker arranque automáticamente
            sudo systemctl enable --now docker

            # Descargar la última imagen del cliente desde Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Detener y eliminar contenedores existentes (si los hay)
            sudo docker ps -q | xargs sudo docker stop || true
            sudo docker ps -q | xargs sudo docker rm || true

            # Iniciar el nuevo contenedor con la imagen descargada
            sudo docker run -d -p 80:80 ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Verificar que el contenedor se esté ejecutando
            sudo docker ps -a

  deploy-user_authentication:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy Docker containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_SERVER_AUTHENTICATION }}
          username: ubuntu
          key: ${{ secrets.KEY_AUTHENTICATION }}
          script: |
            # Verificar si Docker está instalado, si no, instalarlo
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker se inicie automáticamente
            sudo systemctl enable --now docker

            # Descargar las últimas imágenes desde Docker Hub
            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_isAuthentication:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_sendVerifiOTP:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_verifiEmail:latest


            # Verificar si las imágenes fueron descargadas correctamente
            sudo docker images

            # Detener y eliminar los contenedores existentes por nombre
            sudo docker stop microservice_isAuthentication || true
            sudo docker rm microservice_isAuthentication || true
            sudo docker stop microservice_login || true
            sudo docker rm microservice_login || true
            sudo docker stop microservice_logout || true
            sudo docker rm microservice_logout || true
            sudo docker stop microservice_sendVerifiOTP || true
            sudo docker rm microservice_sendVerifiOTP || true
            sudo docker stop microservice_verifiEmail || true
            sudo docker rm microservice_verifiEmail || true

            # Verificar las variables de entorno antes de generar el archivo
            echo "Base de datos: 

            # Crear el archivo .env dentro de la carpeta src
            mkdir -p src
            echo " MONGO_URI=${{ secrets.MONGO_URI }}" >> src/.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> src/.env
            echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> src/.env
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> src/.env
            echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> src/.env

            # Verificar que el archivo .env se ha creado correctamente
            cat src/.env

            # Ejecutar los contenedores Docker con el archivo .env dentro de src
            echo "Ejecutando microservice_isAuthentication..."
            sudo docker run -d --name microservice_isAuthentication --env-file src/.env -p 6000:6000 ${{ secrets.DOCKER_USERNAME }}/microservice_isAuthentication:latest
            echo "Ejecutando microservice_login..."
            sudo docker run -d --name microservice_login --env-file src/.env -p 6001:6001 ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest
            echo "Ejecutando microservice_logout..."
            sudo docker run -d --name microservice_logout --env-file src/.env -p 6002:6002 ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest
            echo "Ejecutando microservice_sendVerifiOTP..."
            sudo docker run -d --name microservice_sendVerifiOTP --env-file src/.env -p 6003:6003 ${{ secrets.DOCKER_USERNAME }}/microservice_sendVerifiOTP:latest
            echo "Ejecutando microservice_verifiEmail..."
            sudo docker run -d --name microservice_verifiEmail --env-file src/.env -p 6004:6004 ${{ secrets.DOCKER_USERNAME }}/microservice_verifiEmail:latest

            # Verificar que los contenedores están corriendo
            sudo docker ps -a