name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - test  # O la rama que estés utilizando

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v2

      # Paso 2: Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 3: Construir y subir la imagen Docker del cliente
      - name: Build and Push Client Docker image
        run: |
          docker build -f client/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/cliente:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/cliente:latest

      # Paso 4: Construir y subir las imágenes Docker de los microservicios
      - name: Build and Push Dog Management Microservices
        run: |
          for service in create update list remove; do
            echo "Building and pushing microservice_${service}_dog..."
            docker build -f dog_management/Microservice_${service}_dog/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest dog_management/Microservice_${service}_dog
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest
          done

  deploy-client:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 (Client) and deploy Docker container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_CLIENT_SERVER }}
          username: ubuntu
          key: ${{ secrets.CLIENT_SERVER_KEY }}
          script: |
            # Asegurarse de que Docker esté instalado
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker arranque automáticamente
            sudo systemctl enable --now docker

            # Descargar la última imagen del cliente desde Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Detener y eliminar contenedores existentes (si los hay)
            sudo docker ps -q | xargs sudo docker stop || true
            sudo docker ps -q | xargs sudo docker rm || true

            # Iniciar el nuevo contenedor con la imagen descargada
            sudo docker run -d -p 80:80 ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # Verificar que el contenedor se esté ejecutando
            sudo docker ps -a

  deploy-dog-management:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 (Dog Management Server) and deploy Docker containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_SERVER_DOG }}
          username: ubuntu
          key: ${{ secrets.DOG_SERVER_KEY }}
          script: |
            # Asegurarse de que Docker esté instalado
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi
            sudo systemctl enable --now docker

            # Detener y eliminar los contenedores existentes de los microservicios
            echo "Deteniendo y eliminando contenedores existentes..."
            for service in create list remove update; do
              sudo docker stop microservice_${service}_dog || true
              sudo docker rm microservice_${service}_dog || true
            done

            # Eliminar imágenes existentes
            echo "Eliminando imágenes existentes..."
            for service in create list remove update; do
              sudo docker rmi -f ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest || true
            done

            # Descargar las últimas imágenes
            echo "Descargando imágenes..."
            for service in create list remove update; do
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest
            done

            # Crear el archivo .env con las variables de entorno necesarias
            echo "DB_NAME=${{ secrets.DB_NAME }}" > src/.env
            echo "DB_USER=${{ secrets.DB_USER }}" >> src/.env
            echo "DB_PASS=${{ secrets.DB_PASS }}" >> src/.env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> src/.env
            cat src/.env

            # Ejecutar los microservicios con sus respectivos puertos
            for service in create list remove update; do
              echo "Ejecutando microservice_${service}_dog..."

              # Asignación de puertos específica para cada servicio
              case $service in
                create)
                  port="4000:4000"
                  ;;
                list)
                  port="4001:4001"
                  ;;
                remove)
                  port="4002:4002"
                  ;;
                update)
                  port="4003:4003"
                  ;;
                *)
                  echo "Servicio no reconocido: ${service}"
                  continue
                  ;;
              esac

              # Ejecutar el contenedor
              sudo docker run -d --name microservice_${service}_dog --env-file src/.env -p $port ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest
            done

            # Verificar que los contenedores estén corriendo
            sudo docker ps -a
