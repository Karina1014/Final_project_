        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_SERVER_CARD }}
          username: ubuntu
          key: ${{ secrets.CARD_SERVER_KEY }}
          script: |
            # Verificar si Docker está instalado, si no, instalarlo
