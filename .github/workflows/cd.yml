              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker se inicie automáticamente
            sudo systemctl enable --now docker

            # Descargar las últimas imágenes desde Docker Hub
            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine_card:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_vaccine_card:latest

            # Verificar si las imágenes fueron descargadas correctamente
            sudo docker images

            # Detener y eliminar los contenedores existentes por nombre
            sudo docker stop microservice_create_vaccine_card || true
            sudo docker rm microservice_create_vaccine_card || true
            sudo docker stop microservice_vaccine_card || true
            sudo docker rm microservice_vaccine_card || true

            # Verificar las variables de entorno antes de generar el archivo
            echo "Base de datos: $REACT_APP_RDS_HOST"

            # Crear el archivo .env dentro de la carpeta src
            mkdir -p src
            echo "MONGO_URI_PYTHON=${{ secrets.MONGO_URI_PYTHON }}" >> src/.env
            echo "MONGO_DB=${{ secrets.MONGO_DB }}" >> src/.env
            echo "GRAPHQL_URL=${{ secrets.GRAPHQL_URL }}" >> src/.env
            echo "DB_SERVER=${{ secrets.DB_SERVER }}" >> src/.env
            echo "DB_SERVER=${{ secrets.DB_USERV }}" >> src/.env
            echo "DB_NAME=${{ secrets.DB_NAMEV }}" >> src/.env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> src/.env
            echo "DRIVER=${{ secrets.DRIVER }}" >> src/.env

            # Verificar que el archivo .env se ha creado correctamente
            cat src/.env

            # Ejecutar los contenedores Docker con el archivo .env dentro de src
            echo "Ejecutando microservice_create_vaccine_card..."
            sudo docker run -d --name microservice_create_vaccine_card --env-file src/.env -p 9000:9000 ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine_card:latest
            echo "Ejecutando microservice_vaccine_card..."
            sudo docker run -d --name microservice_vaccine_card --env-file src/.env -p 7500:7500 ${{ secrets.DOCKER_USERNAME }}/microservice_vaccine_card:latest

            # Verificar que los contenedores están corriendo
            sudo docker ps -a
  deploy-graphql:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy GraphQL container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_GRAPHQL_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_GRAPHQL_SSH_KEY }}
          script: |
            echo " Verificando Docker en EC2..."

            # Verificar si Docker está instalado
            if ! command -v docker &> /dev/null; then
              echo "Instalando Docker..."
              sudo apt update && sudo apt install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            echo " Docker listo."

            # Descargar la última imagen desde Docker Hub
            echo " Haciendo pull de la imagen más reciente..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/microservices_graphql:latest

            # Ejecutar el contenedor en el puerto 3000
            echo " Iniciando contenedor GraphQL..."
            docker run -d -p 3000:3000 --name microservices_graphql ${{ secrets.DOCKER_USERNAME }}/microservices_graphql:latest

            echo "✅Contenedor GraphQL iniciado en el puerto 3000."
