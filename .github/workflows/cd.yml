name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - test  # O la rama que estés utilizando

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v2

      # Paso 2: Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Client Docker image
        run: |
           docker build -f client/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/cliente:latest .
           docker push ${{ secrets.DOCKER_USERNAME }}/cliente:latest

      - name: Build and Push Docker Images vaccine_management
        run: |
            for service in create update list delete; do
            docker build -f vaccine_management/Microservice_${service}_vaccine/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_vaccine:latest \
            vaccine_management/Microservice_${service}_vaccine
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_vaccine:latest
            done
      - name: Build and Push Docker Images dog_management
        run: |
            for service in create list remove update; do
            docker build -f dog_management/Microservice_${service}_dog/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest \
             dog_management/Microservice_${service}_dog
             docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_dog:latest
            done

      - name: Build and Push Docker Images owner_management
        run: |
            for service in create update list delete; do
            docker build -f owner_management/Microservice_${service}_owner/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_owner:latest \
            owner_management/Microservice_${service}_owner
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_owner:latest
            done
         # Paso 4: Construir y subir las imágenes Docker de los microservicios
      - name: Build and Push Microservice isAuthentication
        run: |
          echo "Building and pushing microservice_isauthentication"
          docker build -f user_authentication/Microservice_isAuthentication/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_isauthentication:latest user_authentication/Microservice_isAuthentication
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_isauthentication:latest

      - name: Build and Push Microservice login
        run: |
          echo "Building and pushing microservice_login"
          docker build -f user_authentication/Microservice_login/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest user_authentication/Microservice_login
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest

      - name: Build and Push Microservice logout
        run: |
          echo "Building and pushing microservice_logout"
          docker build -f user_authentication/Microservice_logout/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest user_authentication/Microservice_logout
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest

      - name: Build and Push Microservice sendVerifiOTP
        run: |
          echo "Building and pushing microservice_sendverifiotp"
          docker build -f user_authentication/Microservice_sendVerifiOTP/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_sendverifiotp:latest user_authentication/Microservice_sendVerifiOTP
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_sendverifiotp:latest

      - name: Build and Push Microservice verifiEmail
        run: |
          echo "Building and pushing microservice_verifiemail"
          docker build -f user_authentication/Microservice_verifiEmail/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_verifiemail:latest user_authentication/Microservice_verifiEmail
          docker push ${{ secrets.DOCKER_USERNAME }}/microservice_verifiemail:latest

      - name: Build and Push Microservice_create_vaccine_card
        run: |
            echo "Building and pushing Microservice_create_vaccine_card"
            docker build -f vaccine_card_management/Microservice_create_vaccine_card/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine_card:latest vaccine_card_management/Microservice_create_vaccine_card
            docker push ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine_card:latest
  
      - name: Build and Push Microservice_vaccine_card
        run: |
            echo "Building and pushing Microservice_vaccine_card"
            docker build -f vaccine_card_management/Microservice_vaccine_card/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservice_vaccine_card:latest vaccine_card_management/Microservice_vaccine_card 
      - name: Build and Push Microservice GraphQL
        run: |
            echo "Building and pushing microservices_graphql..."
            docker build -f Microservices-graphql/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/microservices_graphql:latest Microservices-graphql
            docker push ${{ secrets.DOCKER_USERNAME }}/microservices_graphql:latest
  
   
  deploy-client:
      runs-on: ubuntu-latest
      needs: build-and-push

      steps:
        - name: SSH into EC2 (Client) and deploy Docker container
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.EC2_CLIENT_SERVER }}
            username: ubuntu
            key: ${{ secrets.CLIENT_SERVER_KEY }}
            script: |
              # Install Docker on the EC2 instance (Client)
              sudo apt update && sudo apt install -y docker.io

              # Ensure Docker starts automatically
              sudo systemctl enable --now docker

              # Pull the latest client image from Docker Hub
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cliente:latest

              # Stop any running containers
              sudo docker ps -q | xargs sudo docker stop || true
              sudo docker ps -q | xargs sudo docker rm || true

              # Start the new container with the pulled image
              sudo docker run -d -p 80:80 ${{ secrets.DOCKER_USERNAME }}/cliente:latest

              # Verify the container is running
              sudo docker ps -a
     
  deploy-vaccine-management:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy Docker containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_VACCINE_SERVER }}
          username: ubuntu
          key: ${{ secrets.VACCINE_SERVER_KEY }}
          script: |
            # Verificar si Docker está instalado, si no, instalarlo
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker se inicie automáticamente
            sudo systemctl enable --now docker

            # Descargar las últimas imágenes desde Docker Hub
            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_update_vaccine:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_list_vaccine:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_delete_vaccine:latest

            # Verificar si las imágenes fueron descargadas correctamente
            sudo docker images

            # Detener y eliminar los contenedores existentes por nombre
            sudo docker stop microservice_create_vaccine || true
            sudo docker rm microservice_create_vaccine || true
            sudo docker stop microservice_update_vaccine || true
            sudo docker rm microservice_update_vaccine || true
            sudo docker stop microservice_list_vaccine || true
            sudo docker rm microservice_list_vaccine || true
            sudo docker stop microservice_delete_vaccine || true
            sudo docker rm microservice_delete_vaccine || true

            # Verificar las variables de entorno antes de generar el archivo
            echo "Base de datos: $REACT_APP_RDS_HOST"

            # Crear el archivo .env dentro de la carpeta src
            mkdir -p src
            echo "REACT_APP_RDS_HOST=${{ secrets.REACT_APP_RDS_HOST }}" >> src/.env
            echo "REACT_APP_RDS_PORT=${{ secrets.REACT_APP_RDS_PORT }}" >> src/.env
            echo "REACT_APP_RDS_DATABASE=${{ secrets.REACT_APP_RDS_DATABASE }}" >> src/.env
            echo "REACT_APP_RDS_USER=${{ secrets.REACT_APP_RDS_USER }}" >> src/.env
            echo "REACT_APP_RDS_PASSWORD=${{ secrets.REACT_APP_RDS_PASSWORD }}" >> src/.env

            # Verificar que el archivo .env se ha creado correctamente
            cat src/.env

            # Ejecutar los contenedores Docker con el archivo .env dentro de src
            # Ejecutar contenedores Docker con el archivo .env
            echo "Ejecutando microservice_create_vaccine..."
            sudo docker run -d --name microservice_create_vaccine --env-file src/.env -p 3001:3001 ${{ secrets.DOCKER_USERNAME }}/microservice_create_vaccine:latest
            echo "Ejecutando microservice_update_vaccine..."
            sudo docker run -d --name microservice_update_vaccine --env-file src/.env -p 3004:3004 ${{ secrets.DOCKER_USERNAME }}/microservice_update_vaccine:latest
            echo "Ejecutando microservice_list_vaccine..."
            sudo docker run -d --name microservice_list_vaccine --env-file src/.env -p 3002:3002 ${{ secrets.DOCKER_USERNAME }}/microservice_list_vaccine:latest
            echo "Ejecutando microservice_delete_vaccine..."
            sudo docker run -d --name microservice_delete_vaccine --env-file src/.env -p 3003:3003 ${{ secrets.DOCKER_USERNAME }}/microservice_delete_vaccine:latest

            # Verificar que los contenedores están corriendo
            sudo docker ps -a

  deploy-dog-management:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy Docker containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_SERVER_DOG }}
          username: ubuntu
          key: ${{ secrets.DOG_SERVER_KEY }}
          script: |
            # Verificar si Docker está instalado, si no, instalarlo
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt update && sudo apt install -y docker.io
            fi

            # Hacer que Docker se inicie automáticamente
            sudo systemctl enable --now docker

            # Descargar las últimas imágenes desde Docker Hub
            echo "Descargando imágenes..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_create_dog:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_updateDog:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_list_dog:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_remove_dog:latest

            # Verificar si las imágenes fueron descargadas correctamente
            sudo docker images

            # Detener y eliminar los contenedores existentes por nombre
            sudo docker stop microservice_create_dog || true
            sudo docker rm microservice_create_dog || true
            sudo docker stop microservice_updateDog || true
            sudo docker rm microservice_updateDog || true
            sudo docker stop microservice_list_dog || true
            sudo docker rm microservice_list_dog || true
            sudo docker stop microservice_remove_dog || true
            sudo docker rm microservice_remove_dog || true

            # Verificar las variables de entorno antes de generar el archivo
            echo "Base de datos: $REACT_APP_RDS_HOST"

            # Crear el archivo .env dentro de la carpeta src
            mkdir -p src
            echo "REACT_APP_RDS_HOST=${{ secrets.REACT_APP_RDS_HOST }}" >> src/.env
            echo "REACT_APP_RDS_PORT=${{ secrets.REACT_APP_RDS_PORT }}" >> src/.env
            echo "REACT_APP_RDS_DATABASE=${{ secrets.REACT_APP_RDS_DATABASE }}" >> src/.env
            echo "REACT_APP_RDS_USER=${{ secrets.REACT_APP_RDS_USER }}" >> src/.env
            echo "REACT_APP_RDS_PASSWORD=${{ secrets.REACT_APP_RDS_PASSWORD }}" >> src/.env

            # Verificar que el archivo .env se ha creado correctamente
            cat src/.env

            # Ejecutar los contenedores Docker con el archivo .env dentro de src
            echo "Ejecutando microservice_create_dog..."
            sudo docker run -d --name microservice_create_dog --env-file src/.env -p 4000:4000 ${{ secrets.DOCKER_USERNAME }}/microservice_create_dog:latest
            echo "Ejecutando microservice_updateDog..."
            sudo docker run -d --name microservice_updateDog --env-file src/.env -p 4003:4003 ${{ secrets.DOCKER_USERNAME }}/microservice_updateDog:latest
            echo "Ejecutando microservice_list_dog..."
            sudo docker run -d --name microservice_list_dog --env-file src/.env -p 4001:4001 ${{ secrets.DOCKER_USERNAME }}/microservice_list_dog:latest
            echo "Ejecutando microservice_remove_dog..."
            sudo docker run -d --name microservice_remove_dog --env-file src/.env -p 4002:4002 ${{ secrets.DOCKER_USERNAME }}/microservice_remove_dog:latest

            # Verificar que los contenedores están corriendo
            sudo docker ps -a


  deploy-owner-management:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy Docker containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_OWNER_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_OWNER_SSH_KEY }}
          script: |
            echo "🛠️ Verificando Docker en EC2..."
            
            # Verificar si Docker está instalado
            if ! command -v docker &> /dev/null; then
              echo "Instalando Docker..."
              sudo apt update && sudo apt install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            echo "✅ Docker listo."

            # Iniciar sesión en Docker Hub
            echo "🔑 Iniciando sesión en Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Eliminar contenedores e imágenes viejas
            echo "🛑 Eliminando contenedores e imágenes antiguas..."
            docker stop $(docker ps -aq) || true
            docker rm $(docker ps -aq) || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/microservice_create_owner:latest || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/microservice_list_owner:latest || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/microservice_update_owner:latest || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/microservice_delete_owner:latest || true

            # Descargar nuevas imágenes
            echo "📥 Haciendo pull de las imágenes..."
            for service in create list update delete; do
              docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_${service}_owner:latest
            done

            echo "Pull de imágenes completado."

            # Iniciar nuevos contenedores con los puertos asignados
            echo "🚀 Iniciando contenedores..."

            docker run -d -p 8080:8080 --name microservice_create_owner ${{ secrets.DOCKER_USERNAME }}/microservice_create_owner:latest
            docker run -d -p 8081:8081 --name microservice_list_owner ${{ secrets.DOCKER_USERNAME }}/microservice_list_owner:latest
            docker run -d -p 8082:8082 --name microservice_update_owner ${{ secrets.DOCKER_USERNAME }}/microservice_update_owner:latest
            docker run -d -p 8083:8083 --name microservice_delete_owner ${{ secrets.DOCKER_USERNAME }}/microservice_delete_owner:latest
            
            echo "✅ Contenedores iniciados."


  deploy-user_authentication:
      needs: build-and-push
      runs-on: ubuntu-latest

      steps:
        - name: SSH into EC2 and deploy Docker containers
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.EC2_SERVER_AUTHENTICATION }}
            username: ubuntu
            key: ${{ secrets.KEY_AUTHENTICATION }}
            script: |
              # Verificar si Docker está instalado, si no, instalarlo
              if ! command -v docker &> /dev/null; then
                echo "Docker no está instalado. Instalando..."
                sudo apt update && sudo apt install -y docker.io
              fi

              # Hacer que Docker se inicie automáticamente
              sudo systemctl enable --now docker

              # Descargar las últimas imágenes desde Docker Hub
              echo "Descargando imágenes..."
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_isauthentication:latest
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_sendverifiotp:latest
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/microservice_verifiemail:latest

              # Verificar si las imágenes fueron descargadas correctamente
              sudo docker images

              # Detener y eliminar los contenedores existentes por nombre
              sudo docker stop microservice_isauthentication || true
              sudo docker rm microservice_isauthentication || true
              sudo docker stop microservice_login || true
              sudo docker rm microservice_login || true
              sudo docker stop microservice_logout || true
              sudo docker rm microservice_logout || true
              sudo docker stop microservice_sendverifiotp || true
              sudo docker rm microservice_sendverifiotp || true
              sudo docker stop microservice_verifiemail || true
              sudo docker rm microservice_verifiemail || true

              # Verificar las variables de entorno antes de generar el archivo
              echo "Base de datos: ${MONGO_URI}"

              # Crear el archivo .env dentro de la carpeta src
              mkdir -p src
              echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> src/.env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> src/.env
              echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> src/.env
              echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> src/.env
              echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> src/.env
              echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> src/.env

              # Verificar que el archivo .env se ha creado correctamente
              cat src/.env

              # Ejecutar los contenedores Docker con el archivo .env dentro de src
              echo "Ejecutando microservice_isauthentication..."
              sudo docker run -d --name microservice_isauthentication --env-file src/.env -p 6005:6005 ${{ secrets.DOCKER_USERNAME }}/microservice_isauthentication:latest
              echo "Ejecutando microservice_login..."
              sudo docker run -d --name microservice_login --env-file src/.env -p 6001:6001 ${{ secrets.DOCKER_USERNAME }}/microservice_login:latest
              echo "Ejecutando microservice_logout..."
              sudo docker run -d --name microservice_logout --env-file src/.env -p 6002:6002 ${{ secrets.DOCKER_USERNAME }}/microservice_logout:latest
              echo "Ejecutando microservice_sendverifiotp..."
              sudo docker run -d --name microservice_sendverifiotp --env-file src/.env -p 6003:6003 ${{ secrets.DOCKER_USERNAME }}/microservice_sendverifiotp:latest
              echo "Ejecutando microservice_verifiemail..."
              sudo docker run -d --name microservice_verifiemail --env-file src/.env -p 6004:6004 ${{ secrets.DOCKER_USERNAME }}/microservice_verifiemail:latest

              # Verificar que los contenedores están corriendo
              sudo docker ps -a

  deploy-card:
